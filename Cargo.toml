[package]
name = "linz-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A web framework on top of axum with first-class OpenAPI documentation support, ported from Linz"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apskhem/linz-rs"
readme = "README.md"
keywords = ["openapi", "axum", "web", "validation", "json-schema"]
categories = ["web-programming::http-server", "api-bindings"]
include = ["src/**/*", "examples/**/*", "tests/**/*", "benches/**/*", "README.md", "MANUAL.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [] }
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
jsonschema = { version = "0.60.0", default-features = false, features = ["resolve-file"] }
mime = "0.3.17"
oas3 = "0.22.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"

[dev-dependencies]
axum = { version = "0.8.9", features = ["tokio", "http1"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "bootstrap"
# Run the example's tests with `cargo test`, too.
test = true

[[bench]]
name = "api"
harness = false
