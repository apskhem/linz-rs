[package]
name = "linz-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.3", default-features = false, features = ["matched-path", "original-uri"] }
bytes = "1.10.1"
http = "1.3.1"
http-body-util = "0.1.3"
jsonschema = { version = "0.30.0", default-features = false, features = ["resolve-file"] }
mime = "0.3.17"
oas3 = "0.16.0"
schemars = "0.8.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_qs = "0.14.0"
thiserror = "2.0.12"
url = "2.5.4"
