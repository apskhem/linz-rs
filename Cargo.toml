[package]
name = "linz-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = [] }
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
jsonschema = { version = "0.30", default-features = false, features = ["resolve-file"] }
mime = "0.3"
oas3 = "0.16"
regex = "1.11.1"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.14"
thiserror = "2.0"
url = "2.5"
